# El proxy del servidor quita el prefijo (/app1) antes de llegar aquí;
# Django lo vuelve a anteponer en las URLs con FORCE_SCRIPT_NAME.

# Respeta el esquema que manda el proxy de fuera (https); si no hay, usa el propio.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Igual para el host original del dominio.
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $host;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
